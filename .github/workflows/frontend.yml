name: frontend

on:
  push:
    paths:
    - ".github/workflows/frontend.yml"
    - "html/**"
    - "package.json"
    - "pnpm-lock.yaml"
    - "pnpm-workspace.yaml"
  pull_request:
    paths:
    - ".github/workflows/frontend.yml"
    - "html/**"
    - "package.json"
    - "pnpm-lock.yaml"
    - "pnpm-workspace.yaml"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install, check and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run check:web
          pnpm run test:web
          pnpm run build:web
      - name: Verify single-file output
        run: |
          test -s html/dist/index.html
          test -s html/dist/index.html.gz
          ! grep -qE '<script[^>]+src=' html/dist/index.html
          ! grep -qE '<link[^>]+rel="stylesheet"' html/dist/index.html
