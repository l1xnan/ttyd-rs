name: docker

on:
  push:
    branches: main
    tags: ["*"]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: html/pnpm-lock.yaml
      - name: Build frontend
        working-directory: html
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Cross build multi-arch binaries
        run: |
          mkdir dist
          for entry in \
            "amd64:x86_64-unknown-linux-musl" \
            "arm64:aarch64-unknown-linux-musl" \
            "arm:armv7-unknown-linux-musleabihf"
          do
            arch=${entry%%:*}
            target=${entry##*:}
            cross build --manifest-path rust/Cargo.toml --release --target "$target"
            mkdir -p "dist/$arch"
            cp "rust/target/$target/release/ttyd" "dist/$arch/ttyd"
          done
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine docker tags
        id: docker_tag
        run: |
          case $GITHUB_REF in
            refs/tags/*)
              TAG_NAME=${GITHUB_REF#refs/tags/}
              echo "DOCKER_TAG=tsl0922/ttyd:${TAG_NAME}" >> $GITHUB_ENV
              echo "ALPINE_TAG=tsl0922/ttyd:${TAG_NAME}-alpine" >> $GITHUB_ENV
              ;;
            *)
              echo "DOCKER_TAG=tsl0922/ttyd:latest" >> $GITHUB_ENV
              echo "ALPINE_TAG=tsl0922/ttyd:alpine" >> $GITHUB_ENV
              ;;
          esac
      - name: build/push docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_TAG }}
            ghcr.io/${{ env.DOCKER_TAG }}
      - name: build/push docker image (alpine)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.alpine
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          push: true
          tags: |
            ${{ env.ALPINE_TAG }}
            ghcr.io/${{ env.ALPINE_TAG }}
