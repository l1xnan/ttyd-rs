name: backend

on:
  push:
    paths:
    - ".github/workflows/backend.yml"
    - "html/**"
    - "rust/**"
    - "package.json"
    - "pnpm-lock.yaml"
    - "pnpm-workspace.yaml"
  pull_request:
    paths:
    - ".github/workflows/backend.yml"
    - "html/**"
    - "rust/**"
    - "package.json"
    - "pnpm-lock.yaml"
    - "pnpm-workspace.yaml"
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run check:web
          pnpm run test:web
          pnpm run build:web
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path rust/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --manifest-path rust/Cargo.toml
      - name: Build release binary
        run: cargo build --manifest-path rust/Cargo.toml --release

  linux:
    name: linux (${{ matrix.artifact }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_call'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: i686-unknown-linux-musl
            artifact: ttyd.i686
          - target: x86_64-unknown-linux-musl
            artifact: ttyd.x86_64
          - target: armv7-unknown-linux-musleabihf
            artifact: ttyd.armhf
          - target: aarch64-unknown-linux-musl
            artifact: ttyd.aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:web
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build static binary
        run: cross build --manifest-path rust/Cargo.toml --release --target ${{ matrix.target }}
      - name: Stage artifact
        run: cp rust/target/${{ matrix.target }}/release/ttyd ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  windows:
    name: windows
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_call'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:web
      - uses: dtolnay/rust-toolchain@stable
      - name: Build binary
        run: cargo build --manifest-path rust/Cargo.toml --release
      - name: Stage artifact
        run: Copy-Item rust/target/release/ttyd.exe ttyd.win32.exe
      - uses: actions/upload-artifact@v7
        with:
          name: ttyd.win32
          path: ttyd.win32.exe
          if-no-files-found: error

  macos:
    name: macos (${{ matrix.artifact }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_call'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            artifact: ttyd.macos-x86_64
          - os: macos-15
            artifact: ttyd.macos-arm64
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:web
      - uses: dtolnay/rust-toolchain@stable
      - name: Build binary
        run: cargo build --manifest-path rust/Cargo.toml --release
      - name: Stage artifact
        run: cp rust/target/release/ttyd ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
